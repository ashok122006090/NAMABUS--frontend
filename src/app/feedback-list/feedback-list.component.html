<div class="row">

    <h2> Feedback List</h2>

</div>

 

<table class="table table-striped table-bordered">

    <thead>

        <tr>

            <th> Timestamp</th>

            <th> Rating</th>

            <th> Comment</th>

           

            <th> Actions </th>

        </tr>

    </thead>

    <tbody>

        <tr *ngFor="let feedback of feedbacks">

            <td> {{ feedback.timestamp }} </td>

            <td> {{ feedback.rating }} </td>

            <td> {{ feedback.comment }} </td>

           

            <td>

                <button (click)="editFeedback(feedback.id)" class="btn btn-primary"> Edit</button>

                <button (click)="deleteFeedback(feedback.id)" class="btn btn-danger" style="margin-left: 10px"> Delete</button>

            </td>

        </tr>

    </tbody>

</table>
