<div class="row">

    <div class="card col-md-6 offset-md-3 offset-md-3">
  
      <div class="row">
  
        <h3 class="text-center">Create Payment</h3>
  
        <hr />
  
        <div class="card-body">
  
          <form (ngSubmit)="onSubmit()">
  
            <div class="form-group">
  
              <label>Paymentid</label>
  
              <input
  
                type="number"
  
                class="form-control"
  
                id="paymentid"
  
                [(ngModel)]="payment.paymentid"
  
                name="paymentid"
  
              />
  
            </div>
  
            <div class="form-group">
  
              <label>Bookingid</label>
  
              <input
  
                type="number"
  
                class="form-control"
  
                id="bookingid"
  
                [(ngModel)]="payment.bookingid"
  
                name="bookingid"
  
              />
  
            </div>
  
            <div class="form-group">
  
              <label>Amount</label>
  
              <input
  
                type="number"
  
                class="form-control"
  
                id="amount"
  
                [(ngModel)]="payment.amount"
  
                name="amount"
  
              />
  
            </div>
  
   
  
            <div class="form-group">
  
              <label>Payment Status</label>
  
              <select
  
                class="form-control"
  
                id="paymentStatus"
  
                [(ngModel)]="payment.paymentStatus"
  
                name="paymentStatus"
  
              >
  
                <option
  
                  [ngValue]="paymentStatus"
  
                  *ngFor="let paymentStatus of paymentStatusOptions"
  
                >
  
                  {{ paymentStatus }}
  
                </option>
  
              </select>
  
            </div>
  
   
  
            <div class="form-group">
  
              <label>transactionDate</label>
  
              <input
  
                type="string"
  
                class="form-control"
  
                id="transactionDate"
  
                [(ngModel)]="payment.transactionDate"
  
                name="transactionDate"
  
              />
  
            </div>
  
   
  
            <br />
  
            <button class="btn btn-success" type="submit">Submit</button>
  
          </form>
  
        </div>
  
      </div>
  
    </div>
  
  </div>
