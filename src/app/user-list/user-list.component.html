<div class = "row">
    <h2> Available Buses</h2>
</div>

<table class = "table table-striped table-bordered">
    <thead>
        <tr>
            <th> NAME</th>
            <th> PASSWORD </th>
            <th> Bus Type</th>
            <th> PHONE NUMBER </th>
            <th> EMAIL </th>
            <th>  </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor = "let bus of buses" >
            <td> {{ bus.price }} </td>
            <td> {{ bus.seats }} </td>
            <td> {{ bus.busTypes }} </td>
            <td> {{ bus.startpoint }} </td>
            <td> {{ bus.endpoint }} </td>
           <li><a routerLink=" "> book ticket</a></li>
       
           
        </tr>
    </tbody>
</table>
